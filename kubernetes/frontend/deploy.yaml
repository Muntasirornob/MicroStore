---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microstore-frontend
  labels:
    app.kubernetes.io/instance: microstore
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: microstore-frontend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: microstore
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: microstore-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: microstore
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: microstore-frontend
    spec:
      containers:
        - name: frontend
          image: 'microstore/frontend:latest'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: 128Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
