---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microstore-user-service
  labels:
    app.kubernetes.io/instance: microstore
    app.kubernetes.io/component: user-service
    app.kubernetes.io/name: microstore-user-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: microstore
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: microstore-user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: microstore
        app.kubernetes.io/component: user-service
        app.kubernetes.io/name: microstore-user-service
    spec:
      containers:
        - name: user-service
          image: 'microstore/user-service:latest'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_HOST
              value: 'microstore-postgres'
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: 'userdb'
            - name: DB_USERNAME
              value: 'postgres'
            - name: DB_PASSWORD
              value: 'password'
            - name: ALLOWED_ORIGINS
              value: 'http://microstore-api-gateway:8080'
          resources:
            limits:
              memory: 256Mi
              cpu: 300m
            requests:
              memory: 128Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
