---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microstore-product-service
  labels:
    app.kubernetes.io/instance: microstore
    app.kubernetes.io/component: product-service
    app.kubernetes.io/name: microstore-product-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: microstore
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: microstore-product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: microstore
        app.kubernetes.io/component: product-service
        app.kubernetes.io/name: microstore-product-service
    spec:
      containers:
        - name: product-service
          image: 'microstore/product-service:latest'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PORT
              value: "5001"
            - name: DATABASE_URL
              value: 'postgresql+psycopg://postgres:password@microstore-postgres:5432/productdb'
            - name: ALLOWED_ORIGINS
              value: 'http://microstore-api-gateway:8080'
          resources:
            limits:
              memory: 256Mi
              cpu: 300m
            requests:
              memory: 128Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
